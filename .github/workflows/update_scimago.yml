name: Update SCImago lookup

# Сам сайт SCImago из Cloud не скачать (Cloudflare). Берём открытый
# дамп sjrdata на GitHub и кладём компактную таблицу ISSN→квартиль в репозиторий.
# Streamlit Cloud подхватит коммит. Если дамп не менялся — коммита не будет.
on:
  schedule:
    # Два раза в год, после типичного летнего обновления SCImago/sjrdata.
    - cron: "0 6 20 6 *"
    - cron: "0 6 20 12 *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow rdata requests

      - name: Rebuild ISSN lookup
        run: python scimago.py --refresh

      - name: Commit lookup if it changed
        run: |
          git add data/scimago_issn.parquet data/scimago_meta.json
          if git diff --staged --quiet; then
            echo "SCImago lookup is unchanged."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Refresh SCImago ISSN quartile lookup from sjrdata."
          git push
